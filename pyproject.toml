[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "zecpy"
version = "0.1.1"
description = "Shielded Zcash for Python: send and receive private ZEC, built on librustzcash"
readme = "README.pypi.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
keywords = ["zcash", "zec", "shielded", "privacy", "wallet", "payments", "librustzcash"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://zecpy.pages.dev"
Documentation = "https://zecpy.pages.dev/docs/"
Repository = "https://github.com/mikemoulder/zecpy"
"Privacy report" = "https://github.com/mikemoulder/zecpy/blob/main/docs/privacy-report.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "grpcio>=1.76", "grpcio-tools>=1.76"]
examples = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27"]

[project.scripts]
zecpy-cold = "zecpy.cold:main"

[tool.maturin]
python-source = "python"
module-name = "zecpy._native"
# Working notes of the build stay in the repository, out of the package.
exclude = [
    { path = "CLAUDE.md", format = "sdist" },
    { path = "handoff.md", format = "sdist" },
    { path = "memory.md", format = "sdist" },
    { path = "hackathon.yml", format = "sdist" },
]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "devnet: needs the local regtest chain from devnet/up.sh",
    "network: needs internet access (public testnet, Tor)",
]
addopts = "-m 'not network'"
