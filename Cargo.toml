[package]
name = "zecpy"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Native core of ZecPy: shielded Zcash for Python, built on librustzcash"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# Python bindings
pyo3 = { version = "=0.30.1", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "=0.30.0", features = ["tokio-runtime"] }

# Zcash. Exact pins: the crates.io releases of 2026-10-21.
# `transparent-inputs` is deliberately absent from every crate: the code that would query
# the server about transparent addresses is not compiled into ZecPy at all.
zcash_client_backend = { version = "=0.25.0", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "sync"] }
zcash_client_sqlite = { version = "=0.23.0", features = ["orchard"] }
zcash_keys = { version = "=0.17.0", features = ["orchard", "sapling"] }
zcash_primitives = "=0.31.0"
zcash_protocol = { version = "=0.11.0", features = ["local-consensus"] }

# Async + gRPC (versions follow zcash_client_backend's)
async-trait = "0.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }

# Keys and storage
bip0039 = { version = "0.14", features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rusqlite = "0.37"
secrecy = "0.8"
zeroize = "1"

[profile.release]
lto = "thin"
