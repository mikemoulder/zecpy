[package]
name = "zecpy"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Native core of ZecPy: shielded Zcash for Python, built on librustzcash"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# Python bindings
pyo3 = { version = "=0.30.1", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "=0.30.0", features = ["tokio-runtime"] }

# Zcash. Exact pins: the crates.io releases of 2026-10-21.
# `pczt` (cold signing) forces `transparent-inputs` on zcash_client_backend, and
# zcash_client_sqlite must match. ZecPy still never queries the server about transparent
# addresses: that call lived in librustzcash's sync::run, which src/sync.rs replaces, and
# tests/test_devnet_leak_audit.py asserts on every run that no such request is made.
zcash_client_backend = { version = "=0.25.0", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "pczt", "sync", "tor"] }
zcash_client_sqlite = { version = "=0.23.0", features = ["orchard", "serde", "transparent-inputs"] }
zcash_keys = { version = "=0.17.0", features = ["orchard", "sapling"] }
orchard = { version = "=0.16.0", default-features = false }
pczt = { version = "=0.10.0", features = ["prover", "signer", "tx-extractor"] }
sapling = { package = "sapling-crypto", version = "=0.9.0" }
zcash_address = "=0.14.0"
zcash_primitives = "=0.31.0"
# Sapling proving parameters embedded in the binary: no download at runtime.
zcash_proofs = { version = "=0.31.0", features = ["bundled-prover"] }
zcash_protocol = { version = "=0.11.0", features = ["local-consensus"] }
zip32 = "=0.3.0"
zip321 = "=0.10.0"

# Async + gRPC (versions follow zcash_client_backend's)
async-trait = "0.1"
futures-util = "0.3"
prost = "0.14"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }

# Keys and storage
bip0039 = { version = "0.14", features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rusqlite = "0.37"
secrecy = "0.8"
zeroize = "1"

[profile.release]
lto = "thin"

# Halo 2 proving is ~50x slower unoptimized (a send took 121 s in a plain debug build).
# Optimize every dependency even in dev builds; our own crate stays quick to recompile.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
