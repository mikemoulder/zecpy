<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@900&family=Red+Hat+Text:wght@400;500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#18191b}
  .b{width:1280px;height:400px;box-sizing:border-box;padding:44px 56px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;background:#18191b;color:#eff0f1;font-family:"Red Hat Text",sans-serif;position:relative;overflow:hidden}
  .bar{position:absolute;left:0;top:0;width:100%;height:6px;background:#f4b728}
  .name{grid-column:1/3;font-family:"Red Hat Display";font-weight:900;font-size:150px;line-height:.86;letter-spacing:-.05em;text-transform:uppercase;margin-top:18px}
  .tag{grid-row:3;align-self:end;font-size:30px;line-height:1.25;max-width:640px}
  .tag b{font-weight:500;color:#f4b728}
  .side{grid-row:3;grid-column:2;align-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
  .cap{font-size:16px;color:#a4a6ab;align-self:flex-start}
  .stats{display:flex;gap:10px}
  .s{background:#222427;padding:12px 16px 10px;min-width:118px}
  .s.ours{background:#f4b728;color:#18191b}
  .s .n{font-family:"Red Hat Display";font-weight:900;font-size:46px;line-height:.9;letter-spacing:-.04em}
  .s .l{font-size:15px;margin-top:6px;opacity:.85}
  .cmd{font-family:ui-monospace,"Liberation Mono",monospace;font-size:20px;background:#222427;padding:10px 16px;color:#eff0f1}
  .cmd span{color:#f4b728}
</style></head><body>
<div class="b"><div class="bar"></div>
  <div class="name">ZecPy</div>
  <div class="tag">Private Zcash payments for Python.<br><b>Measured, not promised.</b></div>
  <div class="side">
    <div class="cap">Requests that identify the wallet, same five scenarios</div>
    <div class="stats">
      <div class="s ours"><div class="n">0</div><div class="l">ZecPy</div></div>
      <div class="s"><div class="n">7</div><div class="l">zcash-devtool</div></div>
      <div class="s"><div class="n">71</div><div class="l">zingo-cli</div></div>
    </div>
    <div class="cmd"><span>$</span> pip install zecpy</div>
  </div>
</div></body></html>
