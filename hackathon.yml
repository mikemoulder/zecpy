# Per-event config read by the skillz skills. Values here override each skill's CONFIG.md defaults.
hackathon:
  name:     ZECATHON
  theme:    "Thirty days to build something on Zcash that does not leak."
  url:      https://thezecathon.com/
  tracks:   [Shielded Payments, Private Markets, Cross-Chain, Core & Tooling, Wildcard]
  format:   online
  deadline: 2026-10-28T23:59Z   # from the form countdown on 2026-10-26; resubmit allowed until then

target_tracks: [Core & Tooling]   # one submission, one track

team:
  size: 1

rubric:            # official criteria, equal weight assumed until confirmed
  privacy:     25  # leaks are disqualifying, not deductions
  usefulness:  25
  execution:   25
  originality: 25

requires:                # from the submission form, read 2026-10-26
  deployed_url: true     # "Working demo: something the judges can open and use" -> the ZecPy website
  video:        true     # "Two minutes. YouTube, Loom, anything with a link"
  open_source:  true     # repo private until the deadline, public by then, or not judged
  description:  2000     # chars: what it does, why it does not leak, what is real and what is a mock
  track:        one      # pick exactly one

repo:
  layout: flat

commits:
  format:         conventional
  em_dashes:      forbidden
  ai_attribution: forbidden
  identity:       "mikemoulder <dayoife321@gmail.com>"
